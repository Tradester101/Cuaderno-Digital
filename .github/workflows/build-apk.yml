name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          for f in icon.svg icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done

      - name: Generar proyecto Android y sincronizar
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Cuaderno-Digital-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
